<!--
  SSLE Project 1: Wazuh Configuration Template (Practical Guide 4)
  This configuration demonstrates the integration of:
  1. Local log analysis (<localfile>)
  2. Threat intelligence CDB list (<list>)
  3. Active Response firewall-drop (<active-response>)
-->

<ossec_config>

  <!-- Global Rule / List Definitions -->
  <ruleset>
    <!-- Custom Decoders and Rules -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
    <rule_include>local_rules.xml</rule_include>

    <!-- Threat Intelligence: AlienVault IP Reputation CDB List -->
    <list>etc/lists/alienvault_reputation</list>
  </ruleset>

  <!-- Log Ingestion: Monitoring SSLE Microservice Access Logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/ssle/ingestion_access.log</location>
  </localfile>

  <!-- Active Response Command Definitions -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!--
    Active Response Triggers (All Three Project 1 Threats & DoS Quarantine):
    Automatically blocks offending IP via iptables/nftables firewall-drop:
    - Rule 100100: Threat 1 - Shellshock Command Injection (60s)
    - Rule 100101: Threat 1 - AlienVault Reputation Blacklist Match (60s)
    - Rule 100102: Threat 2 - Volumetric HTTP Flood / Botnet DoS (60s)
    - Rule 100104: Threat 3 - Route & Signals Hijacking / MitM Tampering (60s)
    - Rule 100106: Repeated HTTP 429 Rate Limit Breaches (60s)
    - Rule 100108: Repeated HTTP 413 Oversized Payload Submissions (60s)
  -->
  <active-response>
    <command>firewall-drop</command>
    <location>all</location>
    <rules_id>100100, 100101, 100102, 100104, 100106, 100108</rules_id>
    <timeout>60</timeout>
  </active-response>

</ossec_config>
