---
# 1. Shared Storage PVC for SQLite
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssle-shared-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
   requests:
    storage: 100Mi

---
# 2. Service Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-registry
  labels:
    app: ssle-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-registry
  template:
    metadata:
      labels:
        app: ssle-registry
    spec:
      containers:
      - name: registry
        image: ssle-registry:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-registry
spec:
  type: NodePort
  selector:
    app: ssle-registry
  ports:
  - port: 5050
    targetPort: 5050
    nodePort: 30050

---
# 3. Storage Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-storage
  labels:
    app: ssle-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-storage
  template:
    metadata:
      labels:
        app: ssle-storage
    spec:
      containers:
      - name: storage
        image: ssle-storage:latest
        imagePullPolicy: IfNotPresent
        workingDir: /data
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        - name: SERVICE_URL
          value: "http://ssle-storage:5002"
        - name: REGISTRY_URL
          value: "http://ssle-registry:5050/register"
        volumeMounts:
        - name: db-volume
          mountPath: /data
      volumes:
      - name: db-volume
        persistentVolumeClaim:
          claimName: ssle-shared-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-storage
spec:
  type: ClusterIP
  selector:
    app: ssle-storage
  ports:
  - port: 5002
    targetPort: 5002

---
# 4. Ingestion Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-ingestion
  labels:
    app: ssle-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-ingestion
  template:
    metadata:
      labels:
        app: ssle-ingestion
    spec:
      containers:
      - name: ingestion
        image: ssle-ingestion:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: SERVICE_URL
          value: "http://ssle-ingestion:5001"
        - name: REGISTRY_URL
          value: "http://ssle-registry:5050"
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-ingestion
spec:
  type: ClusterIP
  selector:
    app: ssle-ingestion
  ports:
  - port: 5001
    targetPort: 5001

---
# 5. Analytics Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-analytics
  labels:
    app: ssle-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-analytics
  template:
    metadata:
      labels:
        app: ssle-analytics
    spec:
      # Co-locate Analytics with Storage on the same node to access the same PVC
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - ssle-storage
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: analytics
        image: ssle-analytics:latest
        imagePullPolicy: IfNotPresent
        workingDir: /data
        ports:
        - containerPort: 5003
        env:
        - name: PORT
          value: "5003"
        - name: SERVICE_URL
          value: "http://ssle-analytics:5003"
        - name: REGISTRY_URL
          value: "http://ssle-registry:5050"
        - name: DB_PATH
          value: "/data/temp_data.db"
        volumeMounts:
        - name: db-volume
          mountPath: /data
      volumes:
      - name: db-volume
        persistentVolumeClaim:
          claimName: ssle-shared-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-analytics
spec:
  type: NodePort
  selector:
    app: ssle-analytics
  ports:
  - port: 5003
    targetPort: 5003
    nodePort: 30003

---
# 6. Temperature Sensor
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-temperature
  labels:
    app: ssle-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-temperature
  template:
    metadata:
      labels:
        app: ssle-temperature
    spec:
      containers:
      - name: temperature
        image: ssle-temperature:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REGISTRY_URL
          value: "http://ssle-registry:5050"
